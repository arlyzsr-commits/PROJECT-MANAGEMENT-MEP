<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1D"/>
      <stop offset="50%" stop-color="#101B2E"/>
      <stop offset="100%" stop-color="#142238"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#2979FF"/>
      <stop offset="100%" stop-color="#00D8B4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background with subtle electric border -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="url(#cyanBlue)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Central Emblem: Hexagon Shield with MEP Elements -->
  <polygon points="256,90 390,165 390,345 256,420 122,345 122,165" fill="#142238" stroke="url(#cyanBlue)" stroke-width="8" filter="url(#glow)"/>
  
  <!-- Lightning (Electrical) & Circuit Lines -->
  <path d="M256,130 L230,225 L280,225 L245,340 L310,240 L265,240 Z" fill="url(#cyanBlue)" filter="url(#glow)"/>
  
  <!-- Piping / Plumbing loops -->
  <circle cx="190" cy="230" r="28" fill="none" stroke="#00D8B4" stroke-width="6"/>
  <path d="M190,202 L190,160 Q190,140 220,140" fill="none" stroke="#00D8B4" stroke-width="5" stroke-dasharray="6,4"/>
  <circle cx="320" cy="230" r="28" fill="none" stroke="#00E5FF" stroke-width="6"/>
  <path d="M320,258 L320,330 Q320,350 290,350" fill="none" stroke="#00E5FF" stroke-width="5" stroke-dasharray="6,4"/>
  
  <!-- Text MEP -->
  <text x="256" y="380" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#F3F7FF" text-anchor="middle" letter-spacing="6">MEP CONTROL</text>
  <text x="256" y="405" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#00E5FF" text-anchor="middle" letter-spacing="3">BALAK RESORT</text>
</svg>
